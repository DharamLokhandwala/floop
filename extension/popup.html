<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Start a floop review</title>
    <style>
      :root {
        --floop-blue: #3a3cff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        width: 300px;
        padding: 16px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #18181b;
        background: #ffffff;
      }
      .brand {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--floop-blue);
        margin: 0 0 12px;
      }
      .label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #a1a1aa;
        margin: 0 0 4px;
      }
      .url {
        font-size: 13px;
        line-height: 1.4;
        word-break: break-all;
        margin: 0 0 14px;
        color: #27272a;
      }
      .note {
        display: none;
        font-size: 12px;
        line-height: 1.4;
        color: #b45309;
        background: #fffbeb;
        border: 1px solid #fde68a;
        border-radius: 8px;
        padding: 8px 10px;
        margin: 0 0 14px;
      }
      button {
        width: 100%;
        height: 40px;
        border: 0;
        border-radius: 10px;
        background: var(--floop-blue);
        color: #ffffff;
        font-size: 14px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.92;
      }
      button:disabled {
        background: #e4e4e7;
        color: #a1a1aa;
        cursor: not-allowed;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <p class="brand">floop</p>
    <p class="label">Current tab</p>
    <p class="url" id="url">Loading…</p>
    <p class="note" id="note"></p>
    <button id="start" disabled>Start review</button>
    <script src="popup.js"></script>
  </body>
</html>
