<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Start a floop review</title>
    <style>
      /* Tokens mirrored from the floop Figma spec (node 3902:5060). */
      :root {
        --primary: #3a3cff;
        --primary-hover: #3335e6;
        --bg-color: #f9fafb;
        --card-border: #ebeff4;
        --sub-color: #6d6d6d;
        --heading: #181818;
        --outer-border: #f1f1f1;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #ffffff;
      }
      html {
        /* Keep the host browser from painting a dark canvas behind the popup. */
        color-scheme: light;
      }
      body {
        width: 350px;
        padding: 30px;
        display: flex;
        flex-direction: column;
        gap: 60px;
        align-items: flex-start;
        border: 1.5px solid var(--outer-border);
        box-shadow: 5px 4px 20px rgba(55, 55, 55, 0.2);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: var(--heading);
      }
      .top {
        display: flex;
        flex-direction: column;
        gap: 30px;
        align-items: flex-start;
        width: 100%;
      }
      .badge {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 50px;
        height: 50px;
        border-radius: 9px;
        background: var(--primary);
      }
      .badge svg {
        width: 37px;
        height: 15.144px;
        display: block;
      }
      .body-content {
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: flex-start;
        width: 100%;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.48px;
        color: var(--heading);
        margin: 0;
        width: 100%;
      }
      .field-block {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: flex-end;
        width: 100%;
      }
      /* Visually hidden, still announced by screen readers. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .field {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 12px;
        background: var(--bg-color);
        border: 1.064px solid var(--card-border);
        border-radius: 12px;
      }
      .field-icon {
        flex: none;
        width: 20px;
        height: 20px;
        color: var(--sub-color);
      }
      .url-input {
        flex: 1 0 0;
        min-width: 0;
        width: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        font-family: inherit;
        font-size: 14px;
        line-height: 1.5;
        color: var(--sub-color);
        text-overflow: ellipsis;
      }
      .url-input:focus {
        outline: none;
      }
      .url-input::placeholder {
        color: var(--sub-color);
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .action {
        display: flex;
        align-items: center;
        gap: 2px;
        border: 0;
        background: transparent;
        padding: 0;
        font-family: inherit;
        font-size: 12px;
        line-height: 1.5;
        color: var(--sub-color);
        cursor: pointer;
      }
      .action:hover {
        color: var(--heading);
      }
      .action:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
        border-radius: 4px;
      }
      .action-icon {
        position: relative;
        width: 16px;
        height: 16px;
      }
      .action-icon svg {
        position: absolute;
        inset: 0;
        width: 16px;
        height: 16px;
      }
      /* Matches the specificity of `.action-icon svg` above so the hidden
         default actually wins instead of losing to it. */
      .action-icon svg.icon-copy {
        display: block;
      }
      .action-icon svg.icon-check {
        display: none;
        color: #22c55e;
      }
      #copy.is-copied .icon-copy {
        display: none;
      }
      #copy.is-copied .icon-check {
        display: block;
      }
      #edit svg {
        width: 16px;
        height: 16px;
        display: block;
      }
      .note {
        display: none;
        width: 100%;
        font-size: 13px;
        line-height: 1.5;
        color: #b45309;
        background: #fffbeb;
        border: 1.064px solid #fde68a;
        border-radius: 12px;
        padding: 10px 12px;
        margin: 0;
      }
      /* Mirrors the app's default Button variant (components/ui/button.tsx) as
         used on /dashboard/new: a zinc-900 base with a blurred indigo/purple/pink
         gradient glow layered behind it, rather than a flat floop-blue fill. */
      button.primary {
        position: relative;
        z-index: 0;
        overflow: hidden;
        width: 100%;
        height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: #ffffff;
        font-family: inherit;
        font-size: 15px;
        font-weight: 500;
        line-height: 1.3;
        cursor: pointer;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
      }
      button.primary::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background: #18181b;
      }
      button.primary::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(to right, #6366f1, #a855f7, #ec4899);
        filter: blur(8px);
        opacity: 0.4;
        transition: opacity 500ms;
      }
      button.primary:hover:not(:disabled)::before {
        opacity: 0.8;
      }
      button.primary:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      button.primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        pointer-events: none;
      }
    </style>
  </head>
  <body>

        </svg>
      </div>

      <div class="body-content">
        <h1>Pin feedback on the page you're viewing</h1>

        <div class="field-block">
          <label class="sr-only" for="url">Website URL</label>
          <div class="field">
            <svg class="field-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M2.5 10h15M10 2.5c1.9 2.1 2.9 4.7 2.9 7.5s-1 5.4-2.9 7.5c-1.9-2.1-2.9-4.7-2.9-7.5s1-5.4 2.9-7.5Z" stroke="currentColor" stroke-width="1.3"/>
            </svg>
            <input
              class="url-input"
              id="url"
              type="url"
              placeholder="Loading current page…"
              spellcheck="false"
              autocomplete="off"
            />
          </div>

          <div class="actions">
            <button type="button" class="action" id="copy">
              <span class="action-icon" aria-hidden="true">
                <svg class="icon-copy" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="5.5" y="5.5" width="8" height="8" rx="1.6" stroke="currentColor" stroke-width="1.2"/>
                  <path d="M2.5 10.5v-6a2 2 0 0 1 2-2h6" stroke="currentColor" stroke-width="1.2"/>
                </svg>
                <svg class="icon-check" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M3 8.5 6.2 11.5 13 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span id="copyLabel">Copy</span>
            </button>
            <span class="sr-only" id="copyAnnouncement" role="status" aria-live="polite"></span>
            <button type="button" class="action" id="edit">
              <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M11.1 2.4a1.4 1.4 0 0 1 2 2L5.3 12.2l-2.7.6.6-2.7 7.9-7.7Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
              </svg>
              Edit
            </button>
          </div>
        </div>

        <p class="note" id="note"></p>
      </div>
    </div>

    <button type="button" class="primary" id="start" disabled>start reviewing</button>

    <script src="popup.js"></script>
  </body>
</html>
